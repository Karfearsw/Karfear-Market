name: Import KSW Dashboard Archiveon:  workflow_dispatch:permissions:  contents: writejobs:  import:    runs-on: ubuntu-latest    steps:      - name: Checkout        uses: actions/checkout@v4      - name: Verify archive exists        run: |          ls -lah          test -f ksw-dashboard.tar.gz      - name: Extract archive into repo root        run: |          mkdir -p /tmp/ksw_import          tar -xzf ksw-dashboard.tar.gz -C /tmp/ksw_import          rsync -a --delete /tmp/ksw_import/ksw-dashboard/ . \            --exclude .git \            --exclude ksw-dashboard.tar.gz      - name: Commit imported project        run: |          git config user.name "github-actions[bot]"          git config user.email "github-actions[bot]@users.noreply.github.com"          git add -A          git commit -m "chore: import ksw dashboard" || echo "No changes to commit"          git push
